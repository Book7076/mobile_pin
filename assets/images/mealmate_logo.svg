<svg width="400" height="400" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#7D1C34" />
      <stop offset="55%" stop-color="#6E162B" />
      <stop offset="100%" stop-color="#56101F" />
    </radialGradient>

    <!-- Metallic Silver Gradient for Rings -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#F5F5F7" />
      <stop offset="70%" stop-color="#E1E1E6" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- White/Pearl Gradient for Cutlery and Heart -->
    <linearGradient id="whiteSilvGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F7F7FA" />
      <stop offset="100%" stop-color="#EDEDF2" />
    </linearGradient>

    <!-- Filter for soft drop shadow -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1.5" dy="2.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Optional background (can be transparent if needed) -->
  <rect width="220" height="220" rx="32" fill="url(#bgGrad)" />

  <g transform="translate(0, 15)">
    <!-- Interlocking Rings -->
    <g filter="url(#dropShadow)">
      <!-- Left Circle Ring (Center: 74, 65, R: 54) -->
      <circle cx="74" cy="65" r="54" fill="none" stroke="url(#ringGrad)" stroke-width="5.2" />

      <!-- Right Circle Ring (Center: 146, 65, R: 54) -->
      <circle cx="146" cy="65" r="54" fill="none" stroke="url(#ringGrad)" stroke-width="5.2" />

      <!-- Fork (Left Circle) -->
      <path fill="url(#whiteSilvGrad)" d="
        M 46.5 28 
        C 46.5 27, 47.7 27, 47.7 28 
        L 47.7 46 
        C 47.7 47.2, 49.8 47.2, 49.8 46 
        L 49.8 28 
        C 49.8 27, 51.0 27, 51.0 28 
        L 51.0 46 
        C 51.0 47.2, 53.1 47.2, 53.1 46 
        L 53.1 28 
        C 53.1 27, 54.3 27, 54.3 28 
        L 54.3 46 
        C 54.3 47.2, 56.4 47.2, 56.4 46 
        L 56.4 28 
        C 56.4 27, 57.6 27, 57.6 28 
        L 57.6 47 
        C 57.6 52.5, 58.7 55.5, 58.7 57 
        C 58.7 65, 60.2 96, 60.2 99 
        C 60.2 103.5, 51.8 103.5, 51.8 99 
        C 51.8 96, 53.3 65, 53.3 57 
        C 53.3 55.5, 54.4 52.5, 46.5 47 
        Z
      " />

      <!-- Spoon (Right Circle) -->
      <path fill="url(#whiteSilvGrad)" d="
        M 164 27
        C 174.5 27, 174.5 43, 171.5 49
        C 168.5 55, 166.7 56, 166.7 57
        C 166.7 65, 168.2 96, 168.2 99
        C 168.2 103.5, 159.8 103.5, 159.8 99
        C 159.8 96, 161.3 65, 161.3 57
        C 161.3 56, 159.5 55, 156.5 49
        C 153.5 43, 153.5 27, 164 27
        Z
      " />

      <!-- Heart (Center Intersection) -->
      <path fill="url(#whiteSilvGrad)" d="
        M 110 57.3
        C 107 50.7, 98 51.8, 98 59
        C 98 65, 105.8 71.5, 110 76
        C 114.2 71.5, 122 65, 122 59
        C 122 51.8, 113 50.7, 110 57.3
        Z
      " />
    </g>

    <!-- MealMate Brand Title -->
    <text x="110" y="160" text-anchor="middle"
          font-family="Georgia, 'Times New Roman', serif"
          font-weight="900"
          font-style="italic"
          font-size="34"
          letter-spacing="-0.5"
          fill="#FFFFFF"
          filter="url(#dropShadow)">
      MealMate
    </text>
  </g>
</svg>
